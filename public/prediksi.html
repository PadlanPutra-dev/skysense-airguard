<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prediksi Suhu | SkySense</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <input type="checkbox" id="drawerToggle" class="drawer-checkbox">

    <label for="drawerToggle" class="drawer-overlay"></label>


    <!-- SIDEBAR -->
    <aside class="drawer-sidebar">

        <div class="sidebar-header">

            <div class="logo-box">
                <i class="fa-solid fa-cloud-bolt"></i>
                <h2 class="logo">SkySense</h2>
            </div>

            <label for="drawerToggle" class="close-btn">
                <i class="fa-solid fa-xmark"></i>
            </label>

        </div>


        <nav>

            <a href="index.html">
                <i class="fa-solid fa-table-columns"></i>
                Dashboard
            </a>

            <a href="grafik.html">
                <i class="fa-solid fa-chart-line"></i>
                Grafik Sensor
            </a>

            <a href="prediksi.html" class="active">
                <i class="fa-solid fa-chart-area"></i>
                Prediksi Suhu
            </a>

            <a href="riwayat.html">
                <i class="fa-solid fa-clock-rotate-left"></i>
                Riwayat
            </a>

        </nav>

    </aside>


    <!-- MAIN LAYOUT -->
    <div class="layout">


        <!-- TOPBAR -->
        <header class="topbar">

            <div class="header-left">

                <label for="drawerToggle" class="menu-btn">
                    <i class="fa-solid fa-bars"></i>
                </label>

                <div class="top-title">
                    <h1>Prediksi Suhu</h1>
                </div>

            </div>

        </header>


        <!-- CONTENT -->
        <main class="content">


            <!-- PREDICTION CARD -->
            <div class="chart-card">


                <!-- HEADER -->
                <div class="card-header">

                    <h2>
                        <i class="fa-solid fa-chart-area"></i>
                        Prediksi Cuaca
                    </h2>

                </div>


                <!-- CONTROL -->
                <div
                    style="
                        display:flex;
                        align-items:center;
                        gap:12px;
                        margin-bottom:20px;
                        flex-wrap:wrap;
                    "
                >

                    <label
                        for="periode"
                        style="
                            font-size:14px;
                            font-weight:500;
                        "
                    >
                        Periode Prediksi
                    </label>


                    <select
                        id="periode"
                        style="
                            padding:9px 14px;
                            border-radius:8px;
                            border:1px solid #e2e8f0;
                            background:#ffffff;
                            color:#1e293b;
                            font-family:Poppins,sans-serif;
                            cursor:pointer;
                            outline:none;
                        "
                    >

                        <option value="7">
                            1 Minggu
                        </option>

                        <option value="30">
                            1 Bulan
                        </option>

                        <option value="365">
                            1 Tahun
                        </option>

                    </select>

                </div>


                <!-- STATUS -->
                <div
                    id="statusPrediksi"
                    style="
                        margin-bottom:15px;
                        padding:10px 15px;
                        border-radius:10px;
                        background:#eff6ff;
                        color:#2563eb;
                        font-size:13px;
                    "
                >
                    Memuat data prediksi...
                </div>


                <!-- CHART -->
                <div
                    class="chart-box"
                    style="
                        position:relative;
                        height:450px;
                        min-height:450px;
                    "
                >

                    <canvas id="chartPrediksi"></canvas>

                </div>

            </div>


            <!-- TABLE -->
            <div
                class="chart-card"
                style="margin-top:25px;"
            >

                <div class="card-header">

                    <h2>
                        <i class="fa-solid fa-table"></i>
                        Detail Prediksi
                    </h2>

                </div>


                <div class="table-responsive">

                    <table>

                        <thead>

                            <tr>

                                <th>Tanggal</th>
                                <th>TN</th>
                                <th>TX</th>
                                <th>TAVG</th>
                                <th>RH</th>

                            </tr>

                        </thead>


                        <tbody id="predictionTable">

                            <tr>

                                <td
                                    colspan="5"
                                    style="text-align:center;"
                                >
                                    Memuat data...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>


        </main>

    </div>


    <script src="js/prediksi.js"></script>

</body>

</html>
