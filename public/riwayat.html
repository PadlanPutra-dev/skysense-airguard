<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Cuaca - SkySense</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* STYLE KHUSUS HALAMAN RIWAYAT */
        
        /* Container Kartu Putih */
        .history-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            padding: 25px;
            min-height: 80vh; /* Agar terlihat penuh */
            display: flex;
            flex-direction: column;
        }

        /* Header Judul & Tombol */
        .page-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f1f5f9;
        }

        .page-header-flex h2 {
            font-size: 20px;
            color: #1e293b;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Group Tombol Export */
        .action-group {
            display: flex;
            gap: 10px;
        }

        .btn-export {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-export:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-csv { background: #3b82f6; }
        .btn-excel { background: #10b981; }

        /* Tabel Styling (Override style.css untuk tabel kompleks) */
        .table-full-wrapper {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        
        thead th {
            background: #f8fafc;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tbody td {
            padding: 12px 15px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
            color: #334155;
        }

        tbody tr:hover { background-color: #f8fafc; }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .page-header-flex { flex-direction: column; align-items: flex-start; }
            .action-group { width: 100%; }
            .btn-export { flex: 1; justify-content: center; }
        }
    </style>
</head>

<body>

<input type="checkbox" id="drawerToggle" class="drawer-checkbox">
<label for="drawerToggle" class="drawer-overlay"></label>

<aside class="drawer-sidebar">
    <div class="sidebar-header">
        <div class="logo-box">
            <i class="fa-solid fa-cloud-bolt"></i>
            <h2 class="logo">SkySense</h2>
        </div>
        <label for="drawerToggle" class="close-btn"><i class="fa-solid fa-xmark"></i></label>
    </div>

    <nav>
        <a href="index.html" class="active"><i class="fa-solid fa-table-columns"></i> Dashboard</a>
        <a href="grafik.html"><i class="fa-solid fa-chart-line"></i> Grafik Sensor</a>
        <a href="prediksi.html" class="active"><i class="fa-solid fa-chart-area"></i> Prediksi Suhu</a>
        <a href="riwayat.html"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat</a>
        <a href="camera.html"><i class="fa-solid fa-video"></i> Profile</a>
    </nav>
</aside>

<div class="layout">

    <header class="topbar">
        <div class="header-left">
            <label for="drawerToggle" class="menu-btn"><i class="fa-solid fa-bars"></i></label>
            <div class="top-title">
                <h1>Data History</h1>
            </div>
        </div>

        <div class="top-actions">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input class="search-input" id="tableSearch" placeholder="Cari data tanggal..."/>
            </div>
            <button class="toggle-theme"><i class="fa-solid fa-sun"></i></button>
        </div>
    </header>

    <main class="content">

        <section class="history-container">
            
            <div class="page-header-flex">
                <h2><i class="fa-solid fa-database"></i> Laporan Rata-rata Harian</h2>
                
                <div class="action-group">
                    <button class="btn-export btn-csv" onclick="exportCSV()">
                        <i class="fa-solid fa-file-csv"></i> Download CSV
                    </button>
                    <button class="btn-export btn-excel" onclick="exportExcel()">
                        <i class="fa-solid fa-file-excel"></i> Download Excel
                    </button>
                </div>
            </div>

            <div class="table-full-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th rowspan="2" style="border-right: 1px solid #e2e8f0;">Tanggal</th>
                            
                            <th colspan="3" style="text-align:center; border-right: 1px solid #e2e8f0;">Suhu (°C)</th>
                            <th colspan="3" style="text-align:center; border-right: 1px solid #e2e8f0;">Kelembapan (%)</th>
                            <th colspan="3" style="text-align:center; border-right: 1px solid #e2e8f0;">Angin (m/s)</th>
                            <th colspan="3" style="text-align:center;">Cahaya (Lux)</th>
                        </tr>
                        <tr>
                            <th>Avg</th><th>Max</th><th style="border-right: 1px solid #e2e8f0;">Min</th>
                            <th>Avg</th><th>Max</th><th style="border-right: 1px solid #e2e8f0;">Min</th>
                            <th>Avg</th><th>Max</th><th style="border-right: 1px solid #e2e8f0;">Min</th>
                            <th>Avg</th><th>Max</th><th>Min</th>
                        </tr>
                    </thead>
                    <tbody id="historyFullTable">
                        <tr><td colspan="13" style="text-align:center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
    /* ======================================
       GLOBAL DATA
    ====================================== */
    let fullHistoryData = [];

    /* ======================================
       LOAD DATA (AVG DATA)
    ====================================== */
    async function loadFullHistory() {
        try {
            // URL API Anda
            const res = await fetch("http://192.168.1.197:3000/avgdata");
            const data = await res.json();

            fullHistoryData = data;
            renderTable(fullHistoryData);

        } catch (e) {
            console.error("Gagal memuat riwayat:", e);
            document.getElementById("historyFullTable").innerHTML = 
                `<tr><td colspan="13" style="text-align:center; color:red;">Gagal mengambil data server.</td></tr>`;
        }
    }

    /* ======================================
       RENDER TABLE
    ====================================== */
    function renderTable(list) {
        const table = document.getElementById("historyFullTable");
        table.innerHTML = "";

        if(list.length === 0) {
            table.innerHTML = `<tr><td colspan="13" style="text-align:center;">Data tidak ditemukan.</td></tr>`;
            return;
        }

        list.forEach(row => {
            table.innerHTML += `
                <tr>
                    <td style="font-weight:600; border-right: 1px solid #f1f5f9;">${formatTanggal(row.tanggal)}</td>

                    <td>${formatNum(row.avg_temperature)}</td>
                    <td style="color:#ef4444;">${formatNum(row.max_temperature)}</td>
                    <td style="color:#3b82f6; border-right: 1px solid #f1f5f9;">${formatNum(row.min_temperature)}</td>

                    <td>${formatNum(row.avg_humidity)}</td>
                    <td>${formatNum(row.max_humidity)}</td>
                    <td style="border-right: 1px solid #f1f5f9;">${formatNum(row.min_humidity)}</td>

                    <td>${formatNum(row.avg_wind_speed)}</td>
                    <td>${formatNum(row.max_wind_speed)}</td>
                    <td style="border-right: 1px solid #f1f5f9;">${formatNum(row.min_wind_speed)}</td>

                    <td>${formatNum(row.avg_ldr)}</td>
                    <td>${formatNum(row.max_ldr)}</td>
                    <td>${formatNum(row.min_ldr)}</td>
                </tr>
            `;
        });
    }

    /* Helper: Format Tanggal Indonesia */
    function formatTanggal(dateString) {
        const d = new Date(dateString);
        return d.toLocaleDateString("id-ID", { 
            weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' 
        });
    }

    /* Helper: Format Angka (2 desimal) */
    function formatNum(num) {
        return num ? Number(num).toFixed(1) : '-';
    }

    /* ======================================
       SEARCH FUNCTION
    ====================================== */
    document.getElementById("tableSearch").addEventListener("input", function () {
        const keyword = this.value.toLowerCase();

        const filtered = fullHistoryData.filter(row => {
            // Gabungkan semua nilai baris jadi satu string untuk dicari
            const allValues = Object.values(row).join(" ").toLowerCase();
            // Cari kecocokan tanggal atau angka
            return allValues.includes(keyword) || formatTanggal(row.tanggal).toLowerCase().includes(keyword);
        });

        renderTable(filtered);
    });

    /* ======================================
       EXPORT CSV
    ====================================== */
    function exportCSV() {
        if (fullHistoryData.length === 0) {
            alert("Tidak ada data untuk diexport!");
            return;
        }

        const header = Object.keys(fullHistoryData[0]).join(",");
        const rows = fullHistoryData
            .map(row => Object.values(row).join(","))
            .join("\n");

        const csvContent = header + "\n" + rows;
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Laporan_Cuaca_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    }

    /* ======================================
       EXPORT EXCEL
    ====================================== */
    function exportExcel() {
        if (fullHistoryData.length === 0) {
            alert("Tidak ada data untuk diexport!");
            return;
        }

        // Mapping agar header Excel rapi
        const sheetData = fullHistoryData.map(row => ({
            "Tanggal": formatTanggal(row.tanggal),
            "Suhu Rata-rata": row.avg_temperature,
            "Suhu Max": row.max_temperature,
            "Suhu Min": row.min_temperature,
            "Kelembapan Rata-rata": row.avg_humidity,
            "Angin Rata-rata": row.avg_wind_speed,
            "Cahaya Rata-rata": row.avg_ldr
        }));

        const worksheet = XLSX.utils.json_to_sheet(sheetData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Data Cuaca");

        XLSX.writeFile(workbook, `Laporan_Cuaca_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // Jalankan saat halaman siap
    loadFullHistory();
</script>

</body>
</html>
